name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No npm cache here: actions/setup-node's cache needs a lock file, and this
      # repo installs with `npm install` when package-lock.json is absent.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
